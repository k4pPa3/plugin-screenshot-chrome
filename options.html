<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forensic Web Capture</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { padding: 32px 16px; }
    main { max-width: 640px; margin: 0 auto; }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    header img { width: 40px; height: 40px; }
    h1 { font-size: 20px; margin: 0; }
    section { border: 1px solid var(--border); border-radius: 8px; padding: 18px 20px; margin-bottom: 18px; }
    h2 { font-size: 15px; margin: 0 0 4px; }
    .desc { color: var(--muted); margin: 0 0 14px; line-height: 1.45; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
    .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
    .actions button.primary { width: auto; }
    #tsaResult, #saveStatus { font-size: 12.5px; line-height: 1.45; }
    .ok { color: var(--ok); }
    .error { color: var(--danger); }
    h3 { font-size: 13.5px; margin: 18px 0 8px; }
    .vault-actions { display: flex; align-items: flex-end; }
    input:disabled { opacity: .55; }
    .support-card { margin-top: 24px; padding: 14px 16px; background: var(--code-bg); }
    .support-card .desc { margin: 6px 0 10px; }
    .support-recipient { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; }
    .support-recipient code { font-size: 13px; user-select: all; overflow-wrap: anywhere; }
    .support-card button { padding: 5px 9px; font-size: 12px; font-weight: 400; }
    .support-card details { margin-top: 12px; color: var(--muted); font-size: 12px; }
    .support-card summary { cursor: pointer; }
    .support-card a { color: var(--accent); }
    .support-card a:focus-visible, .support-card summary:focus-visible,
    .support-card button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    #supportStatus { min-height: 1.4em; margin: 8px 0 0; font-size: 12px; }
    footer { margin-top: 32px; padding-top: 14px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
<main>
  <header>
    <img src="icons/icon-128.png" alt="">
    <h1 data-i18n="options.heading"></h1>
  </header>

  <section>
    <h2 data-i18n="options.general"></h2>
    <p class="desc" data-i18n="options.language.desc"></p>
    <label class="field">
      <span data-i18n="options.language"></span>
      <select id="language"></select>
    </label>
  </section>

  <section>
    <h2 data-i18n="options.tsa.title"></h2>
    <p class="desc" data-i18n="options.tsa.desc"></p>
    <label class="field">
      <span data-i18n="options.tsa.service"></span>
      <select id="tsaPreset"></select>
    </label>
    <label class="field">
      <span data-i18n="options.tsa.url"></span>
      <input type="url" id="tsaUrl" placeholder="https://…" spellcheck="false">
    </label>
    <div class="grid">
      <label class="field">
        <span data-i18n="options.tsa.username"></span>
        <input type="text" id="tsaUsername" autocomplete="off" spellcheck="false">
      </label>
      <label class="field">
        <span data-i18n="options.tsa.password"></span>
        <input type="password" id="tsaPassword" autocomplete="new-password">
      </label>
      <label class="field">
        <span data-i18n="options.tsa.headerName"></span>
        <input type="text" id="tsaHeaderName" placeholder="X-API-Key" spellcheck="false">
      </label>
      <label class="field">
        <span data-i18n="options.tsa.headerValue"></span>
        <input type="password" id="tsaHeaderValue" autocomplete="new-password">
      </label>
    </div>
    <label class="field">
      <span data-i18n="options.tsa.policy"></span>
      <input type="text" id="tsaPolicyOid" data-i18n-placeholder="options.tsa.policy.placeholder" spellcheck="false">
    </label>
    <label class="field">
      <span data-i18n="options.tsa.caPem"></span>
      <textarea id="tsaCaPem" rows="4" spellcheck="false" placeholder="-----BEGIN CERTIFICATE-----"></textarea>
    </label>
    <p class="desc" data-i18n="options.tsa.caPem.desc"></p>
    <p class="desc" data-i18n="options.tsa.perService"></p>
    <p class="desc error" id="tsaWarning" hidden></p>

    <h3 data-i18n="options.secrets.title"></h3>
    <label class="field">
      <span data-i18n="options.secrets.mode"></span>
      <select id="secretMode">
        <option value="session" data-i18n="options.secrets.session"></option>
        <option value="encrypted" data-i18n="options.secrets.encrypted"></option>
      </select>
    </label>
    <p class="desc" id="secretModeHelp"></p>
    <div id="vaultBox" hidden>
      <div class="grid">
        <label class="field">
          <span id="vaultPasswordLabel"></span>
          <input type="password" id="vaultPassword" autocomplete="new-password">
        </label>
        <div class="field vault-actions">
          <button class="secondary" id="unlock" data-i18n="options.vault.unlock" hidden></button>
        </div>
      </div>
      <p class="desc" id="vaultStatus"></p>
    </div>
    <div class="actions">
      <button class="secondary" id="testTsa" data-i18n="options.test"></button>
      <span id="tsaResult"></span>
    </div>
  </section>

  <section>
    <h2 data-i18n="options.custody.title"></h2>
    <p class="desc" data-i18n="options.custody.desc"></p>
    <div class="grid">
      <label class="field">
        <span data-i18n="row.operator"></span>
        <input type="text" id="custodyOperator" maxlength="120" spellcheck="false">
      </label>
      <label class="field">
        <span data-i18n="row.organization"></span>
        <input type="text" id="custodyOrganization" maxlength="160" spellcheck="false">
      </label>
    </div>
    <label class="switch">
      <input type="checkbox" id="tabHistory"><span class="track"></span>
      <span class="text"><span data-i18n="options.custody.history"></span><br><span class="desc" data-i18n="options.custody.history.help"></span></span>
    </label>
    <label class="switch">
      <input type="checkbox" id="listExtensions"><span class="track"></span>
      <span class="text"><span data-i18n="options.custody.extensions"></span><br><span class="desc" data-i18n="options.custody.extensions.help"></span></span>
    </label>
    <label class="switch">
      <input type="checkbox" id="custodyRequired"><span class="track"></span>
      <span class="text"><span data-i18n="options.custody.required"></span><br><span class="desc" data-i18n="options.custody.required.help"></span></span>
    </label>
  </section>

  <section>
    <h2 data-i18n="options.advanced.title"></h2>
    <p class="desc" data-i18n="options.advanced.desc"></p>
    <div class="grid">
      <label class="field">
        <span data-i18n="options.advanced.jpeg"></span>
        <input type="number" id="jpegQuality" min="1" max="100">
      </label>
      <label class="field">
        <span data-i18n="options.advanced.settle"></span>
        <input type="number" id="settleDelay" min="0" max="10000" step="100">
      </label>
      <label class="field">
        <span data-i18n="options.advanced.timeout"></span>
        <input type="number" id="loadTimeout" min="1000" max="120000" step="1000">
      </label>
      <label class="field">
        <span data-i18n="options.advanced.maxHeight"></span>
        <input type="number" id="maxHeight" min="1000" max="200000" step="1000">
      </label>
      <label class="field">
        <span data-i18n="options.advanced.subfolder"></span>
        <input type="text" id="subfolder" data-i18n-placeholder="options.advanced.subfolder.placeholder" spellcheck="false">
      </label>
      <label class="field">
        <span data-i18n="options.advanced.printOrientation"></span>
        <select id="printOrientation">
          <option value="portrait" data-i18n="options.advanced.printOrientation.portrait"></option>
          <option value="landscape" data-i18n="options.advanced.printOrientation.landscape"></option>
        </select>
      </label>
    </div>
    <label class="switch" style="margin-top: 12px">
      <input type="checkbox" id="tlsCheck"><span class="track"></span>
      <span class="text"><span data-i18n="options.advanced.tlsCheck"></span><br><span class="desc" data-i18n="options.advanced.tlsCheck.help"></span></span>
    </label>
  </section>

  <div class="actions">
    <button class="primary" id="save" data-i18n="options.save"></button>
    <button class="secondary" id="reset" data-i18n="options.reset"></button>
    <span id="saveStatus"></span>
  </div>

  <section class="support-card" aria-labelledby="supportHeading">
    <h2 id="supportHeading" data-i18n="options.support.title"></h2>
    <p class="desc" data-i18n="options.support.desc"></p>
    <div class="support-recipient">
      <span data-i18n="options.support.username"></span>
      <code id="supportUsername" translate="no">@martinandrea86</code>
      <button type="button" class="secondary" id="copySupportUsername" data-i18n="options.support.copyUsername"></button>
    </div>
    <p id="supportStatus" role="status" aria-live="polite"></p>
    <details>
      <summary data-i18n="options.support.inviteTitle"></summary>
      <p class="desc" data-i18n="options.support.inviteDesc"></p>
      <div class="support-recipient">
        <code id="supportPromoCode" translate="no">andreamartin8</code>
        <button type="button" class="secondary" id="copySupportPromo" data-i18n="options.support.copyPromo"></button>
        <a id="supportInviteLink" href="https://web.satispay.com/promocode/69e1c16a-a641-40be-b622-657aa3e26da7" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer" data-i18n="options.support.openInvite"></a>
      </div>
      <p class="desc" data-i18n="options.support.inviteTerms"></p>
    </details>
  </section>

  <footer>
    <span id="version"></span> · <span data-i18n="options.footer"></span>
  </footer>
</main>
<script src="lib/i18n.js"></script>
<script src="lib/locales/en.js"></script>
<script src="lib/locales/it.js"></script>
<script src="lib/locales/fr.js"></script>
<script src="lib/locales/es.js"></script>
<script src="lib/common.js"></script>
<script src="lib/tsa.js"></script>
<script src="lib/tsaroots.js"></script>
<script src="lib/tsaverify.js"></script>
<script src="lib/vault.js"></script>
<script src="options.js"></script>
</body>
</html>
