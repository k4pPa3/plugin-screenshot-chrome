name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    types: [closed]

permissions: {}

jobs:
  release:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Verifica la versione da pubblicare
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          if [ "$EVENT_NAME" = "push" ]; then
            EXPECTED="v$VERSION"
            ACTUAL="$GITHUB_REF_NAME"
          else
            EXPECTED="release/$VERSION"
            ACTUAL="$RELEASE_BRANCH"
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Il riferimento $ACTUAL non corrisponde a $EXPECTED"
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Controlla sintassi e test di regressione
        run: python3 tools/check.py

      - name: Crea il pacchetto
        run: python3 tools/build.py

      - name: Calcola l'hash del pacchetto
        run: cd dist && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt dist/code-fingerprint-*.txt --target "$RELEASE_SHA" --title "$RELEASE_TAG" --generate-notes
