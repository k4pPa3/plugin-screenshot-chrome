name: Test

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Syntax and regression tests (including local OpenSSL TSA)
        run: python3 tools/check.py
      - name: Package extension
        run: python3 tools/build.py

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Real extension regression tests with local fixtures
        env:
          FWC_STORE_SCREENSHOTS_DIR: dist/store-screenshots
        run: xvfb-run -a npm run test:browser
      - name: Build and validate store submission material
        run: |
          python3 tools/build.py
          python3 tools/build_store.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: store-submission-preview
          path: dist/store-submission-*.zip
          if-no-files-found: error
          retention-days: 7
